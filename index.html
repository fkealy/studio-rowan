<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#f6f5f2" />
  <title>Studio Rowan · Leave Less Behind</title>
  <meta name="description" content="Studio Rowan designs and manufactures products made to last, made responsibly, and made with purpose. We're building something worthwhile." />

  <link rel="preload" href="fonts/fraunces-normal.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="fonts/fraunces-italic.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="fonts/inter.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="stylesheet" href="fonts/fonts.css" />

  <link rel="stylesheet" href="styles.css" />

  <script type="importmap">
  {
    "imports": {
      "gsap": "./vendor/gsap.js"
    }
  }
  </script>
</head>
<body>
  <!-- Preloader -->
  <div class="loader" id="loader" aria-hidden="true">
    <div class="loader__inner">
      <span class="loader__mark">Studio Rowan</span>
      <span class="loader__count"><span id="loaderNum">0</span><span class="loader__pct">%</span></span>
    </div>
    <div class="loader__bar"><span id="loaderFill"></span></div>
  </div>

  <!-- Hairline frame -->
  <div class="frame" aria-hidden="true"></div>

  <!-- Content -->
  <main class="page">
    <div class="stage">
      <header class="brand">
        <h1 class="brand__name">
          <span class="line"><span class="line__inner">Studio Rowan</span></span>
        </h1>
        <p class="brand__tagline">
          <span class="line"><span class="line__inner">Leave Less Behind</span></span>
        </p>
      </header>

      <p class="status" data-reveal>
        <span class="status__dot"></span>
        <span>Coming Soon</span>
      </p>
    </div>

    <footer class="foot" data-reveal>
      <p>
        Please contact
        <a class="foot__link" href="mailto:info@studiorowan.co.uk"><span>info@studiorowan.co.uk</span></a>
        in the meantime.
      </p>
    </footer>
  </main>

  <script type="module" src="main.js"></script>
</body>
</html>
